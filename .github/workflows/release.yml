name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run core tests
        run: python test_upgrades.py

      - name: Build exe
        run: pyinstaller DevDashboard.spec --clean

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive dist\DevDashboard.exe, README.md, LICENSE release\DevDashboard-windows-x64.zip
          $hash = (Get-FileHash release\DevDashboard-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  DevDashboard-windows-x64.zip" | Out-File -Encoding ascii release\DevDashboard-windows-x64.zip.sha256

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/DevDashboard-windows-x64.zip
            release/DevDashboard-windows-x64.zip.sha256
